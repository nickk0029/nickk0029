<svg width="260" height="260" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="circleClip">
      <circle cx="130" cy="130" r="90"/>
    </clipPath>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="glowBack" cx="50%" cy="50%" r="55%">
      <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="ringShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="ringGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="130" cy="130" r="120" fill="url(#glowBack)"/>

  <!-- rotating outer ring -->
  <circle cx="130" cy="130" r="103" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="10 6" opacity="0.8" filter="url(#ringGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- bevel ring -->
  <circle cx="130" cy="130" r="94" fill="#0b1220" filter="url(#ringShadow)"/>
  <circle cx="130" cy="130" r="94" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>

  <!-- avatar image (your real GitHub photo) -->
  <image xlink:href="./photo.jpg" href="./photo.jpg" x="40" y="40" width="180" height="180" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- inner rim highlight -->
  <circle cx="130" cy="130" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
</svg>
