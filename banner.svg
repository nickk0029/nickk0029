<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6f7ff"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38a3d1"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#a5e8ff"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>
  <rect width="1200" height="240" fill="url(#glow)"/>

  <!-- extrusion layers (bevel/3D depth) -->
  <g font-family="Verdana, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="600" y="118" font-size="64" fill="#0a1626">Nikhil Joshi</text>
    <text x="600" y="116" font-size="64" fill="#0d1b32">Nikhil Joshi</text>
    <text x="600" y="114" font-size="64" fill="#12294a">Nikhil Joshi</text>
    <text x="600" y="112" font-size="64" fill="#173562">Nikhil Joshi</text>
    <text x="600" y="110" font-size="64" fill="url(#textGrad)" filter="url(#softShadow)">Nikhil Joshi</text>
  </g>

  <g font-family="Verdana, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <text x="600" y="168" font-size="26" fill="#0a1626">Aspiring SDE &#183; Backend Developer</text>
    <text x="600" y="167" font-size="26" fill="#12294a">Aspiring SDE &#183; Backend Developer</text>
    <text x="600" y="166" font-size="26" fill="url(#subGrad)" filter="url(#softShadow)">Aspiring SDE &#183; Backend Developer</text>
  </g>

  <line x1="440" y1="196" x2="760" y2="196" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>
</svg>
